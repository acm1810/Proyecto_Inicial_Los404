<form method="GET" action="{% url 'inicio' %}" class="busqueda-form">
    <input type="text" name="q" placeholder="Buscar atractivo o palabra clave..." value="">
    
    <select name="zona">
        <option value="">Todas las Zonas</option>
        {% for z in zonas %}
            <option value="{{ z.id }}" {% if zona_id == z.id|stringformat:"s" %}selected{% endif %}>
                {{ z.nombre }}
            </option>
        {% endfor %}
    </select>

    <select name="categoria">
        <option value="">Todas las Categorías</option>
        {% for cat in categorias %}
            <option value="{{ cat.id }}" {% if categoria_id == cat.id|stringformat:"s" %}selected{% endif %}>
                {{ cat.nombre }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Buscar</button>
</form>

<p><strong>Resultados encontrados:</strong> {{ total_resultados }}</p>
